<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Erudito Lab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="https://i.postimg.cc/sfPSz5rX/Logo-300-x-300-sin-fondo-1.png" alt="Logo Erudito Lab">
        </a>
        <div class="name">Erudito Lab</div>
    </nav>

    <div class="login-container">
        <div class="login-wrapper">
            <div class="login-info">
                <h2>¡Bienvenido de vuelta!</h2>
                <p>Ingresa a tu cuenta y continúa preparándote para la PAES con los mejores recursos educativos.</p>
            </div>

            <div class="login-form-container">
                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Ingresa tus credenciales para acceder</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="forgot-password">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div id="errorMsg" style="display:none; color:#f44336; margin-bottom:10px; padding:10px; background:#2a0000; border-radius:5px;">
                        </div>

                    <button type="submit" class="btn-submit">Ingresar</button>
                </form>

                <div class="register-link">
                    ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
                </div>

                <div class="back-home">
                    <a href="index.html">← Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

<script src="js/api.js?v=3"></script>
<script src="js/auth.js?v=3"></script>

</body>
</html>
