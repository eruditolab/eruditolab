<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Erudito Lab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="https://i.postimg.cc/sfPSz5rX/Logo-300-x-300-sin-fondo-1.png" alt="Logo Erudito Lab">
        </a>
        <div class="name">Erudito Lab</div>
    </nav>

    <div class="register-container">
        <div class="register-wrapper">
            <div class="register-info">
                <h2>¡Únete a Erudito Lab!</h2>
                <p>Crea tu cuenta y comienza tu preparación para la PAES con los mejores recursos y profesores expertos.</p>
            </div>

            <div class="register-form-container">
                <h2>Crear Cuenta</h2>
                <p class="subtitle">Completa tus datos para registrarte</p>

                <!-- ⚠️ Sin action ni method — lo maneja auth.js via API -->
                <form id="registerForm">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" 
                               placeholder="Juan Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" 
                               placeholder="tu@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" 
                               placeholder="••••••••" required minlength="8">
                        <p class="password-requirements">Mínimo 8 caracteres</p>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirmar Contraseña</label>
                        <input type="password" id="confirm_password" 
                               placeholder="••••••••" required minlength="8">
                    </div>

                    <!-- Mensaje de error -->
                    <div id="errorMsg" style="display:none; color:#f44336; 
                         margin-bottom:10px; padding:10px; background:#2a0000; 
                         border-radius:5px;">
                    </div>

                    <div style="margin: 20px 0; color: #e0e0e0;">
                        <input type="checkbox" id="acepto_terminos" required>
                        <label for="acepto_terminos"> Acepto los 
                            <a href="#" id="openTerminos" 
                               style="color:#00bfff; text-decoration:underline;">
                               Términos y Condiciones de Uso
                            </a>
                            y la
                            <a href="#" id="openPrivacidad" 
                               style="color:#00bfff; text-decoration:underline;">
                               Política de Privacidad
                            </a>
                        </label>
                    </div>

                    <button type="submit" class="btn-submit">Crear Cuenta</button>
                </form>

                <div class="login-link">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
                </div>

                <div class="back-home">
                    <a href="index.html">← Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <div id="topModal" class="top-modal">
        <div class="top-modal-content" id="modalContent"></div>
    </div>

    <!-- ⚠️ ORDEN IMPORTANTE: api.js siempre primero -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/modal-top.js"></script>

    <!-- Validación confirm password -->
    <script>
        document.getElementById('confirm_password').addEventListener('input', function() {
            const pass    = document.getElementById('password').value;
            const confirm = this.value;
            if (pass && confirm) {
                this.style.borderColor = pass === confirm ? '#4caf50' : '#f44336';
            }
        });
    </script>

</body>
</html>
