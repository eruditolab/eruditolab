<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Erudito Lab</title>
    <meta name="description" content="Crea tu cuenta en Erudito Lab y comienza a prepararte para la PAES.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <header class="navbar auth-nav">
        <a href="index.html" class="logo-link">
            <img src="https://i.postimg.cc/sfPSz5rX/Logo-300-x-300-sin-fondo-1.png" alt="Logo Erudito Lab" class="logo-img">
            <span class="logo-text">Erudito Lab</span>
        </a>
        <a href="index.html" class="back-link">← Volver al inicio</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <h2>Crea tu cuenta</h2>
                <p>Únete a miles de estudiantes que ya están preparando la PAES con éxito.</p>
            </div>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regName">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
                </div>
                <div class="form-group">
                    <label for="regEmail">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
                    <small class="input-hint">Debe contener al menos 8 caracteres</small>
                </div>
                <div class="form-group">
                    <label for="regConfirm">Confirmar Contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repite tu contraseña">
                </div>
<div class="terms-group">
  <input type="checkbox" id="terms" name="terms" required>
  <label for="terms">
    Acepto los <a href="terminos.html" id="openTerminos">Términos y Condiciones</a> y la
    <a href="privacidad.html" id="openPrivacidad">Política de Privacidad</a>
  </label>
</div>

                <button type="submit" class="btn-auth">Crear Cuenta</button>
            </form>
            <div class="auth-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 Erudito Lab. Todos los derechos reservados.</p>
            <div class="social-links">
                <a href="https://web.facebook.com/profile.php?id=61575838893388" aria-label="Facebook"><img src="https://i.postimg.cc/ZKK6CR9C/logo-de-facebook.png" alt="FB" class="social-icon"></a>
                <a href="https://www.instagram.com/eruditolab/" aria-label="Instagram"><img src="https://i.postimg.cc/L47mZQ5Y/instagram.png" alt="IG" class="social-icon"></a>
                <a href="https://www.instagram.com/eruditolab/" aria-label="TikTok"><img src="https://i.postimg.cc/MZPPLBRT/tik-tok.png" alt="TK" class="social-icon"></a>
                <a href="https://wa.me/56974864715" target="_blank" aria-label="WhatsApp"><img src="https://i.postimg.cc/8CYmT2dR/whatsapp.png" alt="WA" class="social-icon"></a>
            </div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/modal-top.js"></script>

    <script>
        document.getElementById('confirm_password').addEventListener('input', function() {
            const pass    = document.getElementById('password').value;
            const confirm = this.value;
            if (pass && confirm) {
                this.style.borderColor = pass === confirm ? '#4caf50' : '#f44336';
            }
        });
    </script>
    <div id="topModal" class="top-modal">
  <div class="top-modal-content">
    <span class="close-btn" aria-label="Cerrar">&times;</span>
    <div id="modalContent"></div>
  </div>
</div>
</body>
</html>
