<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Erudito Lab</title>
    <meta name="description" content="Accede a tu cuenta en Erudito Lab y continúa tu preparación PAES.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <header class="navbar auth-nav">
        <a href="index.html" class="logo-link">
            <img src="https://i.postimg.cc/sfPSz5rX/Logo-300-x-300-sin-fondo-1.png" alt="Logo Erudito Lab" class="logo-img">
            <span class="logo-text">Erudito Lab</span>
        </a>
        <a href="index.html" class="back-link">← Volver al inicio</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <h2>Bienvenido de vuelta</h2>
                <p>Ingresa tus credenciales para continuar con tu preparación.</p>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                <div id="errorMsg" style="display:none; color:#ff4444; 
                    background:rgba(255,68,68,0.1); padding:10px; 
                    border-radius:8px; margin-bottom:15px;">
                </div>
                <button type="submit" class="btn-auth">Iniciar Sesión</button>
            </form>
            <div class="auth-footer">
                <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 Erudito Lab. Todos los derechos reservados.</p>
            <div class="social-links">
                <a href="https://web.facebook.com/profile.php?id=61575838893388" aria-label="Facebook"><img src="https://i.postimg.cc/ZKK6CR9C/logo-de-facebook.png" alt="FB" class="social-icon"></a>
                <a href="https://www.instagram.com/eruditolab/" aria-label="Instagram"><img src="https://i.postimg.cc/L47mZQ5Y/instagram.png" alt="IG" class="social-icon"></a>
                <a href="https://www.instagram.com/eruditolab/" aria-label="TikTok"><img src="https://i.postimg.cc/MZPPLBRT/tik-tok.png" alt="TK" class="social-icon"></a>
                <a href="https://wa.me/56974864715" target="_blank" aria-label="WhatsApp"><img src="https://i.postimg.cc/8CYmT2dR/whatsapp.png" alt="WA" class="social-icon"></a>
            </div>
        </div>
    </footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
